# Accept bot-blocked and soft-fail responses common on vendor sites.
accept = ["200..=204", "301..=303", "307..=308", "403", "429"]

max_redirects = 10
timeout = 20
max_concurrency = 8
user_agent = "Mozilla/5.0 (compatible; engineering-modernization-docs-check/1.0)"

# Skip dated raw digests such as signals/2026-03-17.md.
exclude_path = ["signals/20[0-9]{2}-"]

# Vendor hosts that fail automated fetches (HTTP/2 protocol errors or bot walls)
# while resolving in a normal browser.
exclude = ["mckinsey"]

scheme = ["https", "http", "file"]

include_fragments = "full"
accept_timeouts = true
